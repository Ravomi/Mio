[workspace]
members = [".", "crates/mio-core", "crates/mio-agent", "crates/mio-http", "crates/mio-reqwest", "crates/mio-tungstenite", "crates/mio-derive"]
default-members = [".", "crates/mio-core", "crates/mio-agent", "crates/mio-http", "crates/mio-reqwest", "crates/mio-tungstenite", "crates/mio-derive"]
resolver = "3"

[package]
name = "mio-coding-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Headless coding agent engine extracted from Ravomi"
repository = "https://github.com/Ravomi/Mio"
readme = "README.md"
include = [
    "/src",
    "/README.md",
    "/docs/model-catalog.json",
    "/LICENSE",
    "/CREDITS.md",
    "/licenses",
    "/examples",
    "/tests",
    "/Cargo.lock",
    "/Cargo.toml",
]

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
mio-core = { version = "=0.1.0", path = "crates/mio-core", default-features = false, features = ["reqwest", "native-tls"] }
mio-agent = { version = "=0.1.0", path = "crates/mio-agent", default-features = false }
mio-reqwest = { version = "=0.1.0", path = "crates/mio-reqwest", default-features = false, features = ["native-tls"] }
tokio = { version = "=1.53.2", features = ["sync", "time", "macros", "fs", "io-util", "io-std", "signal", "process", "net", "rt-multi-thread"] }
futures-util = "=0.3.34"
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls", "json", "form", "stream", "system-proxy"] }
tempfile = "=3.27.0"
base64 = "=0.22.1"
bytes = "=1.12.1"
sha2 = "=0.10.9"
uuid = { version = "=1.27.0", features = ["v4", "serde"] }
keccak = "=0.1.6"

[dev-dependencies]

[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"
