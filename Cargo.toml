[package]
name = "mio-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
description = "Headless coding agent engine extracted from Ravomi"
repository = "https://github.com/Ravomi/Mio"
readme = "README.md"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
rig-core = { path = "third_party/rig/rig-core", default-features = false, features = ["reqwest", "rustls"] }
rig-agent = { path = "third_party/rig/rig-agent", default-features = false }
rig-reqwest = { path = "third_party/rig/rig-reqwest", default-features = false, features = ["rustls"] }
tokio = { version = "=1.53.2", features = ["sync", "time", "macros", "fs", "io-util", "io-std", "signal", "process", "net", "rt-multi-thread"] }
futures-util = "=0.3.34"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json", "form", "stream", "system-proxy"] }
tempfile = "=3.27.0"
base64 = "=0.22.1"
bytes = "=1.12.1"
sha2 = "=0.10.9"
uuid = { version = "=1.27.0", features = ["v4", "serde"] }
keccak = "=0.1.6"

[dev-dependencies]

[target.'cfg(unix)'.dependencies]
libc = "=0.2.190"
