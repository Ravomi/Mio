name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  quality-check:
    name: Code Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check formatting (cargo fmt)
        run: cargo fmt --check

      - name: Typecheck (cargo check)
        run: cargo check --all-targets --locked

      - name: Run tests (cargo test)
        run: cargo test --locked

      - name: Clippy linter
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test offline installation & npm scripts
        run: |
          python3 -B tests/license_inventory.py
          python3 -B tests/license_bundle.py
          python3 scripts/bundle-licenses.py --verify
          bash -n docs/install.sh
          npm pack --dry-run ./npm
          node scripts/test_install_offline.js

  validate-version:
    name: Validate Version Consistency
    needs: quality-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Cargo.toml and npm/package.json version alignment
        run: |
          TAG="${{ github.ref_name }}"
          CLEAN_VERSION="${TAG#v}"
          echo "Release clean version: $CLEAN_VERSION"

          CARGO_VERSION=$(grep -m 1 '^version = ' Cargo.toml | awk -F '"' '{print $2}')
          NPM_VERSION=$(node -e "console.log(require('./npm/package.json').version)")

          echo "Cargo.toml version: $CARGO_VERSION"
          echo "npm version:        $NPM_VERSION"

          if [ "$CLEAN_VERSION" != "$CARGO_VERSION" ]; then
            echo "Error: Git tag version ($CLEAN_VERSION) does not match Cargo.toml version ($CARGO_VERSION)" >&2
            exit 1
          fi

          if [ "$CLEAN_VERSION" != "$NPM_VERSION" ]; then
            echo "Error: Git tag version ($CLEAN_VERSION) does not match npm package version ($NPM_VERSION)" >&2
            exit 1
          fi

          echo "Version consistency verified."

  build-binaries:
    name: Build Binary (${{ matrix.target }})
    needs: validate-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            archive_ext: tar.gz
            binary: mio
          # Linux arm64 (native runner, no cross)
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive_ext: tar.gz
            binary: mio
          # macOS x64 (Intel)
          - target: x86_64-apple-darwin
            os: macos-15-intel
            archive_ext: tar.gz
            binary: mio
          # macOS arm64 (Apple Silicon)
          - target: aarch64-apple-darwin
            os: macos-15
            archive_ext: tar.gz
            binary: mio
          # Windows x64
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive_ext: zip
            binary: mio.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Build target binary
        shell: bash
        run: |
          cargo build -p mio-coding-agent --bin mio --release --target ${{ matrix.target }} --locked

      - name: Smoke test native binary
        shell: bash
        if: matrix.os != 'macos-15-intel'
        run: |
          if [ -f "target/${{ matrix.target }}/release/${{ matrix.binary }}" ]; then
            BIN="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          else
            BIN="target/release/${{ matrix.binary }}"
          fi
          "$BIN" --version

      - name: Package archive with licenses
        shell: bash
        run: |
          PKG_NAME="mio-${{ matrix.target }}"
          STAGE_DIR="dist_stage"
          mkdir -p "$STAGE_DIR"

          # Copy binary directly to root of stage dir
          if [ -f "target/${{ matrix.target }}/release/${{ matrix.binary }}" ]; then
            cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "$STAGE_DIR/"
          else
            cp "target/release/${{ matrix.binary }}" "$STAGE_DIR/"
          fi

          # Copy licenses and credits directly to root
          cp LICENSE "$STAGE_DIR/"
          cp CREDITS.md "$STAGE_DIR/"
          if [ -d "licenses" ]; then
            cp -r licenses "$STAGE_DIR/"
          fi

          mkdir -p release_artifacts
          if [ "${{ matrix.archive_ext }}" = "zip" ]; then
            # Windows/cross: zip archive with root contents directly
            if command -v 7z >/dev/null 2>&1; then
              (cd "$STAGE_DIR" && 7z a "../release_artifacts/${PKG_NAME}.zip" ./*)
            else
              (cd "$STAGE_DIR" && zip -r "../release_artifacts/${PKG_NAME}.zip" ./*)
            fi
          else
            tar -czvf "release_artifacts/${PKG_NAME}.tar.gz" -C "$STAGE_DIR" .
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: release_artifacts/*

  create-release:
    name: Create GitHub Release & SHA256SUMS
    needs: build-binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: all_artifacts
          merge-multiple: true

      - name: Compute SHA256SUMS
        run: |
          cd all_artifacts
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          cd ..

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            all_artifacts/*
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
