name: SDK Contract

# Standalone SDK / distribution gate for REQ-SDK / REQ-DISTRIBUTION.
# This workflow is separate from the main CI (ci.yml) and does not replace it.
# It never references secrets or external credentials: the contract job is
# offline, and the native matrix only fetches public crates.io crates.
#
# Archival upstream manifests stay in the checkout and are excluded from
# packages. Strict publication hygiene remains a blocking check.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Dependency direction, license metadata and feature matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.95.0

      - name: Fetch locked public dependencies for the offline graph audit
        run: cargo fetch --locked

      - name: Offline SDK contract checks
        run: python3 scripts/check-sdk.py --json "$RUNNER_TEMP/sdk-report.json"

      - name: Directed-graph negative cases and unit self-check
        run: |
          python3 -B tests/sdk_contract.py
          python3 -B tests/license_inventory.py
          python3 -B tests/license_bundle.py
          python3 scripts/bundle-licenses.py --verify

      - name: Publication version and source hygiene gate
        run: python3 scripts/check-sdk.py --strict-publish --json "$RUNNER_TEMP/sdk-report-publish.json"

      - name: Upload contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-contract-report
          path: ${{ runner.temp }}/sdk-report*.json
          if-no-files-found: warn

  examples-and-features:
    name: Native examples and feature matrix (${{ matrix.os }})
    needs: contract
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15
          - windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Minimal and full example compile + helper feature matrix
        shell: bash
        run: |
          python scripts/check-sdk.py --run-local --online \
            --log-dir "$RUNNER_TEMP/mio-sdk-qa" \
            --json "$RUNNER_TEMP/mio-sdk-qa/sdk-report.json"

      - name: Upload local matrix logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-local-matrix-${{ matrix.os }}
          path: ${{ runner.temp }}/mio-sdk-qa
          if-no-files-found: warn
