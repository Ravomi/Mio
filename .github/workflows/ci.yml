name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Rust quality and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Formatting
        run: cargo fmt --check
      - name: Check all targets
        run: cargo check --all-targets --locked
      - name: Unit and integration tests
        run: cargo test --locked
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Build CLI for terminal integration tests
        run: cargo build --locked -p mio-coding-agent --bin mio
      - name: Terminal status protocol
        run: |
          python3 tests/osc7501.py
          python3 tests/cli_cancellation.py
      - name: Website and installation fixtures
        run: |
          python3 scripts/check-site.py
          bash -n docs/install.sh
          npm pack --dry-run ./npm
          node scripts/test_install_offline.js
