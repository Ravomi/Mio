[package]
edition = "2024"
rust-version = "1.95.0"
name = "mio-derive"
version = "0.1.0"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Procedural macros for Mio tools and model contracts."
readme = false
license = "MIT"
repository = "https://github.com/Ravomi/Mio"

exclude = [
    "/Cargo.toml.orig",
    "/.cargo_vcs_info.json",
]

[lib]
name = "mio_derive"
path = "src/lib.rs"
proc-macro = true

[[example]]
name = "async_tool"
path = "examples/rig_tool/async_tool.rs"

[[example]]
name = "complex_types"
path = "examples/rig_tool/complex_types.rs"

[[example]]
name = "full"
path = "examples/rig_tool/full.rs"

[[example]]
name = "simple"
path = "examples/rig_tool/simple.rs"

[[example]]
name = "with_description"
path = "examples/rig_tool/with_description.rs"

[[test]]
name = "calculator"
path = "tests/calculator.rs"

[[test]]
name = "context_value"
path = "tests/context_value.rs"

[[test]]
name = "custom_name"
path = "tests/custom_name.rs"

[[test]]
name = "dependency_rename"
path = "tests/dependency_rename.rs"

[[test]]
name = "embed_trait_dispatch"
path = "tests/embed_trait_dispatch.rs"

[[test]]
name = "embed_tuple"
path = "tests/embed_tuple.rs"

[[test]]
name = "portable_tool"
path = "tests/portable_tool.rs"

[[test]]
name = "required_defaults"
path = "tests/required_defaults.rs"

[[test]]
name = "schemars_schema"
path = "tests/schemars_schema.rs"

[[test]]
name = "serve"
path = "tests/serve.rs"

[[test]]
name = "tool_binding_hygiene"
path = "tests/tool_binding_hygiene.rs"

[[test]]
name = "tool_context"
path = "tests/tool_context.rs"

[[test]]
name = "typed_error"
path = "tests/typed_error.rs"

[[test]]
name = "ui"
path = "tests/ui.rs"

[[test]]
name = "visibility"
path = "tests/visibility.rs"

[dependencies.convert_case]
version = "0.11"

[dependencies.proc-macro-crate]
version = "3"

[dependencies.proc-macro2]
version = "1"
features = ["proc-macro"]

[dependencies.quote]
version = "1"

[dependencies.syn]
version = "2"
features = ["full"]

[dev-dependencies.anyhow]
version = "1"

[dev-dependencies.schemars]
version = "1"

[dev-dependencies.serde]
version = "1"

[dev-dependencies.serde_json]
version = "1.0.54"

[dev-dependencies.tokio]
version = "1"
features = ["full"]

[dev-dependencies.tracing-subscriber]
version = "0.3"

[dev-dependencies.trybuild]
version = "1.0.111"

[lints.clippy]
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
dbg_macro = "forbid"
expect_fun_call = "deny"
expect_used = "deny"
indexing_slicing = "deny"
large_enum_variant = "allow"
panic = "deny"
panic_in_result_fn = "deny"
result_large_err = "allow"
should_implement_trait = "allow"
todo = "forbid"
too_many_arguments = "allow"
type_complexity = "allow"
unimplemented = "forbid"
unreachable = "deny"
unwrap_used = "deny"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = ["cfg(rig_loom)"]

[dev-dependencies.mio-core]
path = "../mio-core"
version = "=0.1.0"
features = ["test-utils", "reqwest"]

[dev-dependencies.mio-agent]
path = "../mio-agent"
version = "=0.1.0"
features = ["test-utils"]
