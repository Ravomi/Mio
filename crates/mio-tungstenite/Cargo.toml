[package]
edition = "2024"
rust-version = "1.95.0"
name = "mio-tungstenite"
version = "0.1.0"
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "The bundled tungstenite WebSocket backend for Mio."
readme = "README.md"
license = "MIT"
repository = "https://github.com/Ravomi/Mio"

exclude = [
    "/Cargo.toml.orig",
    "/.cargo_vcs_info.json",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [
    "--cfg",
    "docsrs",
]

[features]
default = ["rustls"]
native-tls = ["tokio-tungstenite/native-tls"]
rustls = ["tokio-tungstenite/rustls-tls-webpki-roots"]

[lib]
name = "mio_tungstenite"
path = "src/lib.rs"

[[test]]
name = "off_runtime_ownership"
path = "tests/off_runtime_ownership.rs"

[dependencies.futures]
version = "0.3"

[dependencies.mio-http]
path = "../mio-http"
version = "=0.1.0"
features = ["websocket"]

[dependencies.thiserror]
version = "2"

[dev-dependencies.anyhow]
version = "1"

[dev-dependencies.bytes]
version = "1"

[dev-dependencies.http]
version = "1"

[dev-dependencies.serde_json]
version = "1.0.54"

[dev-dependencies.tokio]
version = "1"
features = ["full"]

[dev-dependencies.tokio-tungstenite]
version = "0.29"
features = ["handshake"]
default-features = false

[target.'cfg(not(target_family = "wasm"))'.dependencies.tokio]
version = "1"
features = [
    "rt",
    "rt-multi-thread",
    "macros",
]

[target.'cfg(not(target_family = "wasm"))'.dependencies.tokio-tungstenite]
version = "0.29"
features = [
    "connect",
    "handshake",
]
default-features = false

[lints.clippy]
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
dbg_macro = "forbid"
expect_fun_call = "deny"
expect_used = "deny"
indexing_slicing = "deny"
large_enum_variant = "allow"
panic = "deny"
panic_in_result_fn = "deny"
result_large_err = "allow"
should_implement_trait = "allow"
todo = "forbid"
too_many_arguments = "allow"
type_complexity = "allow"
unimplemented = "forbid"
unreachable = "deny"
unwrap_used = "deny"

[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = ["cfg(rig_loom)"]
